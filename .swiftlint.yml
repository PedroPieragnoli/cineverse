# SwiftLint Configuration for Cineverse

included:
  - Cineverse

excluded:
  - Pods
  - DerivedData
  - CineverseTests
  - "**/*.generated.swift"

disabled_rules:
  - todo

opt_in_rules:
  # Safety
  - force_unwrapping
  - implicitly_unwrapped_optional
  - discouraged_optional_boolean

  # SwiftUI
  - private_swiftui_state

  # Modern syntax
  - shorthand_optional_binding
  - direct_return

  # Performance
  - first_where
  - last_where
  - empty_count
  - contains_over_filter_count

  # Code style
  - sorted_imports
  - closure_spacing
  - trailing_closure
  - redundant_nil_coalescing
  - vertical_whitespace_closing_braces

line_length:
  warning: 120
  error: 150
  ignores_urls: true
  ignores_comments: true

file_length:
  warning: 400
  error: 600

function_body_length:
  warning: 40
  error: 100

function_parameter_count:
  warning: 5
  error: 8

cyclomatic_complexity:
  warning: 10
  error: 20

identifier_name:
  min_length: 2
  max_length: 50
  excluded:
    - id
    - i
    - j
    - x
    - y
    - ok
    - vm
    - db
    - url

type_name:
  min_length: 3
  max_length: 50

force_unwrapping:
  severity: error

implicitly_unwrapped_optional:
  severity: error
  mode: all_except_iboutlets

private_swiftui_state:
  severity: error

vertical_whitespace:
  max_empty_lines: 1

reporter: "xcode"
