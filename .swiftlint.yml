# SwiftLint Configuration for Cineverse

included:
  - Cineverse

excluded:
  - Pods
  - DerivedData
  - CineverseTests
  - CineverseUITests

disabled_rules:
  - todo

opt_in_rules:
  - force_unwrapping
  - private_swiftui_state
  - sorted_imports

line_length:
  warning: 120
  error: 150
  ignores_urls: true

file_length:
  warning: 400
  error: 600

function_body_length:
  warning: 40
  error: 100

identifier_name:
  min_length: 2
  excluded:
    - id
    - i
    - x
    - y
    - ok
    - vm
    - db

force_unwrapping:
  severity: error

reporter: "xcode"
